<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A responsive calculator built with HTML, CSS, and JavaScript."
    />
    <title>Web Calculator</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7C5CFF">
  </head>
  <body>
    <main class="page">
      <h1>Calculator</h1>

      <section class="calculator" aria-label="Calculator">
        <div class="display" aria-live="polite" aria-atomic="true">
          <div class="display__row display__row--previous">
            <p class="display__previous" data-previous-operand></p>
          </div>

          <div class="display__row display__row--current">
            <p class="display__current" data-current-operand>0</p>
          </div>
        </div>

        <div class="keys">
          <button class="key key--utility" type="button" data-clear>AC</button>
          <button
            class="key key--utility"
            type="button"
            data-delete
            aria-label="Delete"
          >
            ⌫
          </button>
          <button class="key key--utility" type="button" data-percent>%</button>
          <button class="key key--operator" type="button" data-operation="/">
            ÷
          </button>

          <button class="key" type="button" data-number="7">7</button>
          <button class="key" type="button" data-number="8">8</button>
          <button class="key" type="button" data-number="9">9</button>
          <button class="key key--operator" type="button" data-operation="*">
            ×
          </button>

          <button class="key" type="button" data-number="4">4</button>
          <button class="key" type="button" data-number="5">5</button>
          <button class="key" type="button" data-number="6">6</button>
          <button class="key key--operator" type="button" data-operation="-">
            −
          </button>

          <button class="key" type="button" data-number="1">1</button>
          <button class="key" type="button" data-number="2">2</button>
          <button class="key" type="button" data-number="3">3</button>
          <button class="key key--operator" type="button" data-operation="+">
            +
          </button>

          <button class="key key--wide" type="button" data-number="0">0</button>
          <button class="key" type="button" data-number=".">.</button>
          <button class="key key--equals" type="button" data-equals>=</button>
        </div>
      </section>

      <p class="hint">You can also use keyboard · Enter = Equals · Esc = Clear</p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
